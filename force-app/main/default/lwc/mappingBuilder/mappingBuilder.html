<template>
    <div class="slds-form-element">
        <label class="slds-form-element__label" for="mapping-builder">
            <abbr if:true={required} class="slds-required" title="required">*</abbr>
            {label}
        </label>
        <div class="slds-form-element__control">
            <div class="slds-grid slds-gutters">
                <!-- Object Selector -->
                <div class="slds-col slds-size_1-of-6">
                    <c-object-selector name="object" label="Object" required={required} disabled={disabled}
                        value={selectedObject} onchange={handleObjectChange}>
                    </c-object-selector>
                </div>

                <!-- Field Selector -->
                <template if:true={showFieldSelector}>
                    <div class="slds-col slds-size_1-of-6">
                        <c-field-selector name="field" label="Field" required={required} disabled={disabled}
                            object-name={selectedObject} value={selectedField}
                            support-relationships={supportRelationships} onchange={handleFieldChange}>
                        </c-field-selector>
                    </div>
                </template>

                <!-- Nested Field Selectors -->
                <template for:each={relationshipChain} for:item="relationship">
                    <div key={relationship.field} class="slds-col slds-size_1-of-6">
                        <c-field-selector name={relationship.field} label="Related Field" required={required}
                            disabled={disabled} object-name={relationship.relatedObject} value={selectedRelatedField}
                            support-relationships={supportRelationships} onchange={handleRelatedFieldChange}>
                        </c-field-selector>
                    </div>
                </template>
            </div>

            <template if:true={error}>
                <div class="slds-form-element__help slds-text-color_error">{error}</div>
            </template>
        </div>
    </div>
</template>
