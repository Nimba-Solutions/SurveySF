<template>
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="min-width: 800px;">
                <!-- Header -->
                <header class="slds-modal__header">
                    <lightning-button-icon class="slds-modal__close" icon-name="utility:close" alternative-text="Close"
                        variant="bare-inverse" onclick={closeModal}></lightning-button-icon>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
                        <slot name="header">Modal Header</slot>
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1"
                    style="min-height: 400px;">
                    <slot name="body">Modal Body</slot>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <slot name="footer">
                        <lightning-button label="Cancel" variant="neutral" onclick={closeModal}></lightning-button>
                        <lightning-button class="slds-m-left_x-small" label="Save" variant="brand"
                            onclick={handleSave}></lightning-button>
                    </slot>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
