<template>
    <div class="slds-form-element">
        <template if:true={showLabel}>
            <label class="slds-form-element__label" for={name}>
                <abbr if:true={required} class="slds-required" title="required">*</abbr>
                {label}
            </label>
        </template>
        <div class="slds-form-element__control">
            <lightning-input data-id={name} label={label} variant="label-hidden" onchange={handleSearch}
                onfocus={showOptions} type="search" value={searchValue} placeholder={placeholder} required={required}
                disabled={disabled}>
            </lightning-input>
            <div if:true={showDropdown} class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid" role="listbox">
                <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                    <template for:each={filteredOptions} for:item="option">
                        <li key={option.value} data-id={name} data-value={option.value} role="presentation"
                            class="slds-listbox__item" onclick={handleOptionSelect}>
                            <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                role="option">
                                <span class="slds-media__body">
                                    <span class="slds-truncate" title={option.label}>
                                        {option.label}
                                    </span>
                                </span>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
            <template if:true={error}>
                <div class="slds-form-element__help slds-text-color_error">{error}</div>
            </template>
        </div>
    </div>
</template>
